name: e2e setup
description: >-
  The setup the `e2e` and `screenshots` jobs share: dependencies, the Playwright set (E2E_ITEMS),
  this shard's part of it, and, when the shard has tests, the browser, the fonts and the build.
  The repository must already be checked out with full history (scripts/changed-e2e.ts diffs
  against origin/main).

inputs:
  items:
    description: The workflow's `items` input (a manual dispatch); empty = computed
    default: ""
  full:
    description: The workflow's `full` input
    default: "false"
  shard:
    description: This job's shard, 1 to `shards`
    required: true
  shards:
    description: The number of shards in this job's matrix
    required: true

outputs:
  items:
    description: The chosen set (`all`, `none` or a list)
    value: ${{ steps.filter.outputs.items }}
  run:
    description: Whether this shard has tests to run (`true` or `false`)
    value: ${{ steps.plan.outputs.run }}
  shard-args:
    description: The Playwright arguments for this shard's part (empty when one shard runs it all)
    value: ${{ steps.plan.outputs.args }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    # Main (its push run or a dispatch there) and `full=true` run everything; a dispatch's
    # `items` input runs that set; anything else, pull requests included (with or without the
    # `full-visual` label, which only turns their screenshots on), runs the set its diff needs (lib/e2e-filter.ts has
    # the rules; a change to the CI workflow or to this action selects everything).
    - name: Choose the visual set
      id: filter
      shell: bash
      env:
        ITEMS: ${{ inputs.items }}
        FULL: ${{ inputs.full }}
      run: |
        ITEMS="${ITEMS// /}"
        reasons=""
        if [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$FULL" = "true" ]; then
          items=all
          why="$GITHUB_EVENT_NAME on $GITHUB_REF_NAME"
          if [ "$FULL" = "true" ]; then why="$why, full=true"; fi
          why="$why: every variant and spec"
        elif [ -n "$ITEMS" ]; then
          if ! [[ "$ITEMS" =~ ^[a-z0-9,-]+$ ]]; then echo "::error::items must be names separated by commas"; exit 1; fi
          items="$ITEMS"; why="the items input"
        else
          items=$(pnpm exec tsx scripts/changed-e2e.ts --base=origin/main 2> "$RUNNER_TEMP/changed-e2e.txt")
          cat "$RUNNER_TEMP/changed-e2e.txt"
          reasons=$(grep '^  ' "$RUNNER_TEMP/changed-e2e.txt" || true)
          why="$GITHUB_EVENT_NAME: computed from the diff against origin/main"
        fi
        echo "E2E_ITEMS=$items ($why)"
        echo "E2E_ITEMS=$items" >> "$GITHUB_ENV"
        echo "items=$items" >> "$GITHUB_OUTPUT"
        {
          echo "Visual set: \`E2E_ITEMS=$items\` ($why); \`E2E_PIXELS=${E2E_PIXELS:-on}\`; \`SITE_FULL=${SITE_FULL:-}\`; \`UPDATE_SNAPSHOTS=${UPDATE_SNAPSHOTS:-}\`"
          if [ -n "$reasons" ]; then
            echo
            echo '```'
            echo "$reasons" | sed 's/^  //'
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
        echo "SITE_FULL=${SITE_FULL:-} (1: the landing is also shot whole)"
    # A small set runs on the first shard alone, unsharded: every other shard would pay for the
    # browser, the fonts and a build to run a handful of tests. A large set is split as before.
    # The set's size comes from `--list`, which loads the specs but starts no server.
    - name: Plan the shard
      id: plan
      shell: bash
      env:
        ITEMS: ${{ steps.filter.outputs.items }}
        SHARD: ${{ inputs.shard }}
        SHARDS: ${{ inputs.shards }}
        # Below this many tests (each width counts) one runner is quicker than a build per shard.
        SMALL_SET: "150"
      run: |
        if [ "$ITEMS" = "none" ]; then
          echo "Nothing the visual suite covers changed: no tests."
          echo "Plan: nothing the visual suite covers changed; no tests" >> "$GITHUB_STEP_SUMMARY"
          echo "run=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The config imports the variant map, which is generated (gitignored); the build makes it
        # again later.
        pnpm gen:variants
        list=$(pnpm exec playwright test -c e2e/playwright.config.ts --list --pass-with-no-tests 2>&1) || true
        total=$(grep -oP '^Total: \K[0-9]+' <<< "$list" || true)
        if [ -z "$total" ]; then
          echo "$list"
          echo "::error::playwright --list failed"
          exit 1
        fi
        if [ "$total" = "0" ]; then
          echo "$list"
          echo "::error::E2E_ITEMS=$ITEMS selects no tests"
          exit 1
        fi
        if [ "$total" -lt "$SMALL_SET" ]; then
          run=false
          if [ "$SHARD" = "1" ]; then run=true; fi
          args=""
          plan="$total tests: shard 1 runs them all"
        else
          run=true
          # Shard 1 always has a test, so it keeps Playwright's "no tests found" failure.
          args="--shard=$SHARD/$SHARDS"
          if [ "$SHARD" != "1" ]; then args="$args --pass-with-no-tests"; fi
          plan="$total tests over $SHARDS shards"
        fi
        echo "$plan; this shard: run=$run $args"
        echo "Plan: $plan; shard $SHARD/$SHARDS runs: $run" >> "$GITHUB_STEP_SUMMARY"
        echo "run=$run" >> "$GITHUB_OUTPUT"
        echo "args=$args" >> "$GITHUB_OUTPUT"
    - name: Playwright version
      id: playwright
      if: steps.plan.outputs.run == 'true'
      shell: bash
      run: echo "version=$(grep -m1 -oP '^  playwright-core@\K[0-9.]+' pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      id: browsers
      if: steps.plan.outputs.run == 'true'
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - if: steps.plan.outputs.run == 'true'
      shell: bash
      run: pnpm exec playwright install chromium
    # System libraries come from apt; only a cache miss pays for the mirror.
    - if: steps.plan.outputs.run == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm exec playwright install-deps chromium
    # The fonts install-deps would bring (CJK, emoji, Unifont) are needed on every run: without
    # them Japanese set in a Latin face (Geist) renders blank, and baselines written on a
    # cache hit differ from those written on a miss (Task 68 found 18 such shots).
    #
    # Their .deb files are cached, so a run needs a package mirror only when that cache is
    # empty: on 2026-11-11 the runners could not resolve any ubuntu.com host for hours
    # (azure.archive, archive and security alike, while the hosts themselves were up), and
    # every visual job failed here before a single test ran. With an empty cache and no
    # ubuntu.com, the files come from kernel.org's mirror of the same archive: apt checks
    # them against Ubuntu's signed indexes whichever mirror serves them. The cached files
    # also pin the fonts' versions, so a package update cannot move a glyph under the
    # baselines.
    - name: Ubuntu release
      id: os
      if: steps.plan.outputs.run == 'true'
      shell: bash
      run: . /etc/os-release && echo "codename=$VERSION_CODENAME" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      id: fonts
      if: steps.plan.outputs.run == 'true'
      with:
        path: ${{ runner.temp }}/font-debs
        key: font-debs-${{ steps.os.outputs.codename }}-v1
    - name: Fonts
      if: steps.plan.outputs.run == 'true'
      shell: bash
      env:
        FONT_PACKAGES: fonts-ipafont-gothic fonts-wqy-zenhei fonts-freefont-ttf fonts-liberation fonts-noto-color-emoji fonts-unifont fonts-tlwg-loma-otf
      run: |
        debs="$RUNNER_TEMP/font-debs"
        mkdir -p "$debs"
        # Fetch the packages and whatever they depend on that the image lacks, as files.
        fetch() {
          mkdir -p "$debs/partial"
          sudo apt-get update -qq &&
            sudo apt-get install -y -qq --no-install-recommends --download-only -o Dir::Cache::archives="$debs" $FONT_PACKAGES
        }
        # The runner's mirror list names only ubuntu.com hosts; this one is outside that domain.
        elsewhere() {
          echo "::warning::no ubuntu.com mirror; fetching the fonts from mirrors.kernel.org"
          printf '%s\tpriority:1\n%s\tpriority:2\n' http://mirrors.kernel.org/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/apt-mirrors.txt
        }
        if ! ls "$debs"/*.deb > /dev/null 2>&1; then
          # Ask the resolver first: apt takes about eight minutes to give up on a name.
          if ! getent hosts azure.archive.ubuntu.com > /dev/null; then
            elsewhere
            fetch
          elif ! fetch; then
            elsewhere
            sudo rm -f "$debs"/*.deb
            fetch
          fi
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$(id -u):$(id -g)" "$debs"
        fi
        ls -1 "$debs"
        # From the files alone, with dpkg: apt would read them as its own user, which may not
        # enter the runner's temp folder, and would wait on the resolver first (four minutes
        # in run 43060493756). The fetch above already brought any dependency the image lacks.
        sudo dpkg -i "$debs"/*.deb
    - if: steps.plan.outputs.run == 'true'
      shell: bash
      run: pnpm build
