name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Rewrite the baselines that differ or are missing and upload just those as an artifact
        type: boolean
        default: false
      items:
        description: "Visual set (E2E_ITEMS): items and site/mcp/annotations, comma-separated; empty = computed from the diff against main"
        type: string
        default: ""
      full:
        description: Run what main runs (every visual shot, the full registry smoke)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep manual runs (baseline updates) from cancelling the push run on the same ref, and
  # dispatches with different inputs from cancelling each other.
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.items }}-${{ inputs.full }}-${{ inputs.update-snapshots }}
  cancel-in-progress: true

jobs:
  # `pnpm run ci` (the full local gate) is `ci:checks` then the smoke; CI runs the two halves as
  # parallel jobs, so a run takes the longer of them, not their sum.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm skill:validate` runs the Agent Skills validator (Python) through uvx.
      - uses: astral-sh/setup-uv@v10.3.3
      # Lint, every generator's check, skill validate, typecheck, tests with coverage, registry
      # validate and build.
      - run: pnpm run ci:checks

  smoke:
    runs-on: ubuntu-latest
    # The full smoke (every item, main and `full`) takes about 4 minutes on a runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # `registry:smoke --changed` diffs against origin/main: full history, trees only.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A branch dispatch smokes only the items its diff touches: pnpm appends `--changed` to the
      # script's last command, `pnpm registry:smoke`. Push, pull requests, main and `full` smoke
      # every item.
      - name: pnpm run ci:smoke
        env:
          SMOKE_ARGS: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.full && '--changed' || '' }}
        run: pnpm run ci:smoke $SMOKE_ARGS

  visual:
    runs-on: ubuntu-latest
    # `playwright install --with-deps` waits on the Ubuntu apt mirror, which took 11 minutes on
    # 2026-11-05 (15 MB at 23 kB/s); the full suite needs about 7. A browser cache hit skips apt.
    timeout-minutes: 30
    env:
      # The landing and the component index are shot whole (as well as their first viewport)
      # only on main (its push run, or a dispatch there) and `full` dispatches;
      # e2e/site.spec.ts has the rule.
      SITE_FULL: ${{ (github.ref == 'refs/heads/main' || inputs.full) && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # scripts/changed-e2e.ts diffs against origin/main: full history, trees only.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Push, pull requests, main and `full` run every shot; a branch dispatch runs the `items`
      # input, or the set its diff needs (lib/e2e-filter.ts has the rules).
      - name: Choose the visual set
        id: filter
        env:
          ITEMS: ${{ inputs.items }}
          FULL: ${{ inputs.full }}
        run: |
          ITEMS="${ITEMS// /}"
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" = "refs/heads/main" ] || [ "$FULL" = "true" ]; then
            items=all; why="$GITHUB_EVENT_NAME on $GITHUB_REF_NAME${FULL:+, full=$FULL}: every demo and spec"
          elif [ -n "$ITEMS" ]; then
            if ! [[ "$ITEMS" =~ ^[a-z0-9,-]+$ ]]; then echo "::error::items must be names separated by commas"; exit 1; fi
            items="$ITEMS"; why="the items input"
          else
            items=$(pnpm exec tsx scripts/changed-e2e.ts --base=origin/main); why="computed from the diff against origin/main"
          fi
          echo "E2E_ITEMS=$items ($why)"
          echo "E2E_ITEMS=$items" >> "$GITHUB_ENV"
          echo "items=$items" >> "$GITHUB_OUTPUT"
          echo "Visual set: \`E2E_ITEMS=$items\` ($why); \`SITE_FULL=${SITE_FULL:-}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "SITE_FULL=${SITE_FULL:-} (1: the landing and the index are also shot whole)"
      - name: Playwright version
        id: playwright
        if: steps.filter.outputs.items != 'none'
        run: echo "version=$(grep -m1 -oP '^  playwright-core@\K[0-9.]+' pnpm-lock.yaml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        if: steps.filter.outputs.items != 'none'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.filter.outputs.items != 'none'
        run: pnpm exec playwright install chromium
      # System libraries and fonts come from apt; only a cache miss pays for the mirror.
      - if: steps.filter.outputs.items != 'none' && steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium
      - if: steps.filter.outputs.items != 'none'
        run: pnpm build
      - if: ${{ steps.filter.outputs.items != 'none' && !inputs.update-snapshots }}
        run: pnpm test:e2e
      # `changed` rewrites only the baselines that are missing or fail the comparison, so the
      # artifact holds exactly the PNGs to commit: a straight copy, no sifting.
      - if: ${{ steps.filter.outputs.items != 'none' && inputs.update-snapshots }}
        run: pnpm test:e2e --update-snapshots=changed
      - name: Collect the rewritten baselines
        if: ${{ steps.filter.outputs.items != 'none' && inputs.update-snapshots }}
        run: |
          out="$RUNNER_TEMP/playwright-baselines"
          mkdir -p "$out"
          git status --porcelain --untracked-files=all -- e2e/__screenshots__ | cut -c4- > "$RUNNER_TEMP/baselines.txt"
          while read -r file; do
            target="$out/${file#e2e/__screenshots__/}"
            mkdir -p "$(dirname "$target")"
            cp "$file" "$target"
          done < "$RUNNER_TEMP/baselines.txt"
          count=$(wc -l < "$RUNNER_TEMP/baselines.txt")
          echo "$count baseline(s) rewritten"
          cat "$RUNNER_TEMP/baselines.txt"
          { echo "**$count baseline(s) rewritten**"; sed 's/^/- /' "$RUNNER_TEMP/baselines.txt"; } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ steps.filter.outputs.items != 'none' && inputs.update-snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-baselines
          path: ${{ runner.temp }}/playwright-baselines
          if-no-files-found: warn
      - if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: e2e/test-results
          if-no-files-found: ignore
